<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instructor Approval — Trucking MBA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg-dark: #121214;
      --card-bg: #1e1e22;
      --gold-primary: #d4af37;
      --gold-gradient: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #aa7c11 100%);
      --gold-btn: linear-gradient(90deg, #e5c060, #b8860b);
      --text-light: #ffffff;
      --text-muted: #a0a0a5;
      --input-bg: #26262b;
    }

    body {
      font-family: 'Barlow', sans-serif;
      /* Portal va registratsiya sahifalari bilan bir xil premium geometrik fon */
      background-color: var(--bg-dark);
      background-image: 
        linear-gradient(135deg, rgba(18, 18, 20, 0.95) 0%, rgba(26, 26, 30, 0.98) 100%),
        radial-gradient(circle at 80% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 10% 80%, rgba(170, 124, 17, 0.05) 0%, transparent 50%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text-light);
    }

    .login-card {
      background: var(--card-bg);
      border-radius: 6px;
      border: 1px solid rgba(212, 175, 55, 0.1);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
      padding: 45px 40px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s;
    }

    /* Yuqoridagi nafis tilla chiziq */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 3px;
      background: var(--gold-gradient);
    }

    .login-card:hover {
      border-color: rgba(212, 175, 55, 0.25);
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header h2 {
      font-family: 'Barlow Condensed', sans-serif;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 30px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .field { 
      margin-bottom: 22px; 
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold-primary);
      margin-bottom: 8px;
    }

    /* INPUTS STYLING */
    input {
      width: 100%;
      padding: 14px 18px;
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      font-family: 'Barlow', sans-serif;
      font-size: 15px;
      color: var(--text-light);
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus { 
      border-color: var(--gold-primary);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.15);
      background: #2a2a30;
    }

    /* ACTION BUTTON */
    .btn {
      width: 100%;
      padding: 16px;
      background: var(--gold-btn);
      color: #0f1013;
      border: none;
      border-radius: 4px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn:hover { 
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
      transform: scale(1.01);
    }

    /* ERROR MESSAGES */
    .error-msg {
      background: rgba(231, 76, 60, 0.08);
      color: #ff4a4a;
      border: 1px solid rgba(231, 76, 60, 0.2);
      padding: 12px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 25px;
      text-align: center;
    }

    /* BACK LINK */
    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
      letter-spacing: 0.5px;
      transition: color 0.2s;
    }

    .back:hover { 
      color: var(--gold-primary); 
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="header">
      <h2>Instructor Login</h2>
      <p>Required to unlock Final Exam</p>
    </div>

    {% if messages %}
      {% for message in messages %}
        <div class="error-msg">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" required placeholder="Instructor username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn">Unlock Exam</button>
    </form>

    <a href="{% url 'home' %}" class="back">← Back to Portal</a>
  </div>

</body>
</html>
