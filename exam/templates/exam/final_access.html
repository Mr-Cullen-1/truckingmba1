<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instructor Approval — Trucking MBA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0f1f38;
      --blue: #1a3c5e;
      --gold: #e8a020;
      --light: #f4f6fa;
      --text: #1a1a2e;
    }
    body {
      font-family: 'Barlow', sans-serif;
      background: var(--light);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: white;
      border-radius: 4px;
      box-shadow: 0 8px 40px rgba(15,31,56,0.13);
      width: 100%;
      max-width: 400px;
      padding: 40px;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h2 {
      font-family: 'Barlow Condensed', sans-serif;
      color: var(--navy);
      font-size: 28px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .header p {
      font-size: 14px;
      color: #666;
      margin-top: 5px;
    }
    .field { margin-bottom: 20px; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #dde3ee;
      border-radius: 3px;
      font-family: 'Barlow', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--blue); }
    .btn {
      width: 100%;
      padding: 15px;
      background: var(--navy);
      color: white;
      border: none;
      border-radius: 3px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--blue); }
    .error-msg {
      background: #fdf0f0;
      color: #c0392b;
      padding: 10px;
      border-radius: 3px;
      font-size: 13px;
      margin-bottom: 20px;
      text-align: center;
    }
    .back {
      display: block;
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: #888;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="header">
      <h2>Instructor Login</h2>
      <p>Required to unlock Final Exam</p>
    </div>

    {% if messages %}
      {% for message in messages %}
        <div class="error-msg">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" required placeholder="Instructor username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn">Unlock Exam</button>
    </form>

    <a href="{% url 'home' %}" class="back">← Back to Portal</a>
  </div>

</body>
</html>
