<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trucking MBA — Submitted</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Barlow', sans-serif;
      background: #0f1f38;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: white; border-radius: 4px;
      max-width: 500px; width: 100%;
      text-align: center; padding: 60px 48px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .check {
      width: 72px; height: 72px; border-radius: 50%;
      background: #e8f5e9;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 28px; font-size: 36px;
    }
    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 30px; font-weight: 800;
      color: #0f1f38; margin-bottom: 14px;
    }
    p { color: #555; font-size: 16px; line-height: 1.6; margin-bottom: 36px; }
    .actions { display: flex; justify-content: center; } /* Faqat bitta tugma uchun markazlash */
    .btn {
      padding: 14px 40px; border: none; border-radius: 3px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 17px; font-weight: 700;
      cursor: pointer; text-decoration: none; display: inline-block;
      transition: opacity 0.2s;
    }
    .btn-primary { background: #0f1f38; color: white; }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Exam Submitted!</h1>
    <p>Your answers have been collected.<br>Thank you for your participation.</p>
    <div class="actions">
      <a href="{% url 'register' %}" class="btn btn-primary">New Session</a>
    </div>
  </div>
</body>
</html>
